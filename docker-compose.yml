# Приложение + PostgreSQL: docker compose up --build → http://localhost:8080
services:
  app:
    build: .
    environment:
      - BACKEND_PORT=8080
      - DATABASE_URL=postgres://calendar:calendar@db:5432/calendar
      # Профиль Владельца: берётся из окружения хоста (или .env), без них — значения по умолчанию backend.
      - OWNER_NAME
      - OWNER_BIO
      - OWNER_TIME_ZONE
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: calendar
      POSTGRES_DB: calendar
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
