name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Ставит mise и инструменты из mise.toml (JDK, Node) с кэшем.
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      # Кэш Gradle (wrapper, зависимости, build cache).
      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: mise run install

      # Playwright использует предустановленный на ubuntu-latest Google Chrome (channel: 'chrome').
      - name: Check (contract, lint, tests, build, API and e2e)
        run: mise run check

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

      - name: Generated API files are committed
        run: mise run api:verify

  # Образ из Dockerfile + PostgreSQL из docker-compose.yml: контейнер поднимается и отвечает.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image and start compose
        run: docker compose up --build --detach --wait db app

      - name: GET /api/health → 200, / → index.html
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health; then
              echo
              curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
              curl -fsS http://localhost:8080/admin | grep -q '<div id="root">'
              exit 0
            fi
            sleep 2
          done
          echo "backend не ответил за 120 с"
          exit 1

      - name: Container logs
        if: always()
        run: docker compose logs

      - name: Stop compose
        if: always()
        run: docker compose down --volumes

      # Так образ запускает проверка и хостинг: один контейнер, порт из PORT, без DATABASE_URL
      # (embedded PostgreSQL внутри).
      - name: Standalone container on PORT=3000
        run: |
          docker build --quiet --tag calendar .
          docker run --detach --name standalone -e PORT=3000 -p 3000:3000 calendar
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/health; then
              echo
              curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
              exit 0
            fi
            sleep 2
          done
          echo "контейнер не ответил на PORT=3000 за 180 с"
          exit 1

      - name: Standalone container logs
        if: always()
        run: docker logs standalone || true
