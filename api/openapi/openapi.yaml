openapi: 3.0.0
info:
  title: Calendar Booking API
  version: 0.1.0
tags:
  - name: System
paths:
  /api/health:
    get:
      operationId: getHealth
      description: Проверка, что сервис поднят и отвечает.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      tags:
        - System
components:
  schemas:
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      description: Состояние сервиса.
servers:
  - url: http://localhost:8080
    description: Локальный backend
    variables: {}
