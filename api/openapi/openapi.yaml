openapi: 3.0.0
info:
  title: Calendar Booking API
  version: 1.0.0
  description: |-
    API «Календаря звонков»: Гости бронируют встречи с Владельцем без регистрации.
    Поведение и правила — docs/spec.md. Все моменты времени — UTC (ISO 8601, `...Z`).
tags:
  - name: System
  - name: Owner
  - name: MeetingTypes
  - name: Bookings
paths:
  /api/bookings:
    get:
      operationId: listUpcomingBookings
      description: Предстоящие встречи всех Типов (ещё не закончившиеся), по возрастанию `startAt`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
      tags:
        - Bookings
    post:
      operationId: createBooking
      description: Создание Бронирования Гостем.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: Поля запроса не прошли проверку.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Тип встречи с таким id не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingTypeNotFoundError'
        '409':
          description: |-
            Время пересекается с существующим Бронированием любого Типа встречи
            (в том числе проигравший одновременный запрос).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotTakenError'
        '422':
          description: Старт вне Окна записи или Рабочих часов, не на сетке :00/:30 или уже в прошлом.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotUnavailableError'
      tags:
        - Bookings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
  /api/bookings/{id}:
    get:
      operationId: getBooking
      description: Одно Бронирование — для страницы подтверждения.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          description: Бронирование с таким id не найдено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingNotFoundError'
      tags:
        - Bookings
  /api/health:
    get:
      operationId: getHealth
      description: Проверка, что сервис поднят и отвечает.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      tags:
        - System
  /api/meeting-types:
    get:
      operationId: listMeetingTypes
      description: Каталог Типов встреч.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
      tags:
        - MeetingTypes
    post:
      operationId: createMeetingType
      description: Создание Типа встречи (Владелец).
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: Поля запроса не прошли проверку.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Тип встречи с таким id уже существует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingTypeExistsError'
      tags:
        - MeetingTypes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingType'
  /api/meeting-types/{id}:
    get:
      operationId: getMeetingType
      description: Один Тип встречи.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '404':
          description: Тип встречи с таким id не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingTypeNotFoundError'
      tags:
        - MeetingTypes
  /api/meeting-types/{id}/slots:
    get:
      operationId: listSlots
      description: |-
        Все старты Окна записи (14 дней с сегодняшнего по часовому поясу Владельца,
        пн–пт 09:00–18:00, шаг 30 минут) со статусом, по возрастанию `startAt`.
        Прошедшие старты не возвращаются.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '404':
          description: Тип встречи с таким id не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingTypeNotFoundError'
      tags:
        - MeetingTypes
  /api/owner:
    get:
      operationId: getOwner
      description: Профиль Владельца.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Owner'
      tags:
        - Owner
components:
  schemas:
    Booking:
      type: object
      required:
        - id
        - meetingTypeId
        - meetingTypeName
        - startAt
        - endAt
        - guestName
        - guestEmail
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/BookingId'
        meetingTypeId:
          $ref: '#/components/schemas/MeetingTypeId'
        meetingTypeName:
          type: string
          description: Название Типа встречи на момент чтения — для подтверждения и списка Владельца.
        startAt:
          type: string
          format: date-time
          description: Начало, UTC.
        endAt:
          type: string
          format: date-time
          description: Окончание, UTC; вычисляет сервер.
        guestName:
          type: string
        guestEmail:
          type: string
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
      description: Бронирование.
    BookingId:
      type: string
      format: uuid
      description: Идентификатор Бронирования (UUID), выдаёт сервер.
    BookingNotFoundError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - booking_not_found
        message:
          type: string
      description: Бронирование с таким id не найдено.
    CreateBookingRequest:
      type: object
      required:
        - meetingTypeId
        - startAt
        - guestName
        - guestEmail
      properties:
        meetingTypeId:
          $ref: '#/components/schemas/MeetingTypeId'
        startAt:
          type: string
          format: date-time
          description: Начало встречи, UTC; должно совпадать со стартом свободного Слота.
        guestName:
          type: string
          minLength: 1
          maxLength: 100
        guestEmail:
          type: string
          format: email
        comment:
          type: string
          maxLength: 500
      description: Запрос Гостя на Бронирование.
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Имя поля запроса, например `guestEmail`.
        message:
          type: string
          description: Понятный человеку текст на русском.
      description: Ошибка проверки одного поля.
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      description: Состояние сервиса.
    MeetingType:
      type: object
      required:
        - id
        - name
        - durationMinutes
      properties:
        id:
          $ref: '#/components/schemas/MeetingTypeId'
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 240
          description: 'Длительность в минутах: 15…240, кратно 15.'
      description: Тип встречи.
    MeetingTypeExistsError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - meeting_type_exists
        message:
          type: string
      description: Тип встречи с таким id уже существует.
    MeetingTypeId:
      type: string
      minLength: 2
      maxLength: 40
      pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
      description: 'id Типа встречи: задаёт Владелец, уникален и неизменяем, используется в адресе `/book/{id}`.'
    MeetingTypeNotFoundError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - meeting_type_not_found
        message:
          type: string
      description: Тип встречи с таким id не найден.
    Owner:
      type: object
      required:
        - name
        - bio
        - timeZone
      properties:
        name:
          type: string
          minLength: 1
        bio:
          type: string
          description: Короткое описание для страниц Гостя.
        timeZone:
          type: string
          description: Часовой пояс Рабочих часов, IANA (`Asia/Almaty`).
      description: Профиль Владельца, задаётся конфигурацией сервера.
    Slot:
      type: object
      required:
        - startAt
        - endAt
        - status
      properties:
        startAt:
          type: string
          format: date-time
          description: Начало, UTC.
        endAt:
          type: string
          format: date-time
          description: Окончание = начало + длительность Типа встречи, UTC.
        status:
          type: string
          enum:
            - available
            - busy
          description: '`busy` — интервал `[startAt, endAt)` пересекается с любым Бронированием.'
      description: 'Слот: возможное время начала встречи выбранного Типа встречи.'
    SlotTakenError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - slot_taken
        message:
          type: string
      description: |-
        Время пересекается с существующим Бронированием любого Типа встречи
        (в том числе проигравший одновременный запрос).
    SlotUnavailableError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - slot_unavailable
        message:
          type: string
      description: Старт вне Окна записи или Рабочих часов, не на сетке :00/:30 или уже в прошлом.
    ValidationError:
      type: object
      required:
        - code
        - message
        - fieldErrors
      properties:
        code:
          type: string
          enum:
            - validation_failed
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      description: Поля запроса не прошли проверку.
servers:
  - url: http://localhost:8080
    description: Локальный backend
    variables: {}
